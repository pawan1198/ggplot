format:
  html:
    theme:
      light: [flatly, custom.scss]
    css: styles.css
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    code-copy: true
    code-fold: false
    highlight-style: github
    smooth-scroll: true
    anchor-sections: true

execute:
  freeze: auto
  echo: true
  warning: false
  message: false
  eval: false
